<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <title>Unlock · RanSan Tracker</title>
  <link rel="manifest" href="tracker.webmanifest">
  <link rel="stylesheet" href="asset/tracker/entry-glass.css">
  <script src="asset/tracker/tracker-feedback.js?v=loadfix13"></script>
<script src="asset/tracker/tracker-navigation.js?v=loadfix13"></script>
<script src="asset/tracker/app-shell.js"></script>
<link rel="stylesheet" href="asset/tracker/report-polish.css?v=loadfix13">
</head>
<body>
  <main class="entry-card">
    <div class="entry-mark" aria-hidden="true">₹</div>
    <p class="entry-brand">RANSAN TRACKER</p>
    <h1>Unlock your tracker</h1>
    <p class="entry-copy">Enter your PIN to open your workspace.</p>
    <form id="pinForm">
      <label for="pinInput">Workspace PIN</label>
      <input id="pinInput" type="password" required>
      <button class="entry-primary" type="submit">Unlock tracker</button>
      <p id="pinMessage" class="entry-message" role="status"></p>
    </form>
    <button id="signOut" class="entry-link" type="button">Sign out</button>
  </main>
  <script>
    const form = document.getElementById('pinForm');
    const button = form.querySelector('button');
    const message = document.getElementById('pinMessage');
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (button.disabled || !window.completeTrackerUnlock) return;
      button.disabled = true;
      button.textContent = 'Checking PIN…';
      message.textContent = '';
      try {
        const response = await fetch("https://opensheet.elk.sh/1w1oYIh_GTWmCn3u9PD7lj3w1NnFdDEbU32EeezDc22g/Setup");
        if (!response.ok) throw new Error('PIN lookup failed');
        const rows = await response.json();
        const pin = rows.find(row => String(row.Key).trim().toUpperCase() === 'PIN')?.Value;
        if (pin == null || pin === '') throw new Error('PIN unavailable');
        if (document.getElementById('pinInput').value === String(pin)) {
          window.completeTrackerUnlock();
          return;
        }
        message.textContent = 'Incorrect PIN. Try again.';
      } catch {
        message.textContent = 'Unable to verify the PIN. Check your connection and try again.';
      }
      button.disabled = false;
      button.textContent = 'Unlock tracker';
    });
    document.getElementById('signOut').addEventListener('click', () => {
      sessionStorage.removeItem('ranSanLastUnlockedActivity');
      localStorage.removeItem('isLoggedIn');
      localStorage.removeItem('user');
      location.replace('login.html');
    });
  </script>
</body>
</html>
